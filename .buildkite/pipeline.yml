steps:
  - label: "bundle"
    commands:
      - .buildkite/build-bundle.sh
      # The bundle goes up under the branch and commit it was built from, and
      # HEAD names it once it is in place.
      - >-
        aws s3 cp bundle.tar.gz
        s3://flyio-builds/spegel/${BUILDKITE_BRANCH}/${BUILDKITE_COMMIT}.tar.gz
        --region us-east-2
      - >-
        printf '%s' "${BUILDKITE_COMMIT}"
        | aws s3 cp - s3://flyio-builds/spegel/${BUILDKITE_BRANCH}/HEAD
        --region us-east-2
    agents:
      queue: "high-concurrency"
    artifact_paths:
      - bundle.tar.gz
